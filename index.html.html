<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>겨울 외출 준비물 체크</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #e0f2fe 0%, #f1f5f9 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 28px 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      width: 100%;
      max-width: 420px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }

    .badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #0284c7;
      background-color: #e0f2fe;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.5rem;
      color: #10b981;
      margin-bottom: 16px;
    }

    .header-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .item-input {
      flex: 1;
      padding: 11px 14px;
      font-size: 0.95rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    .item-input:focus {
      border-color: #10b981;
    }

    .add-btn {
      padding: 11px 16px;
      background-color: #10b981;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s;
    }

    .add-btn:hover {
      background-color: #059669;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
      text-align: left;
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background-color: #ffffff;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .item-row:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .item-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      color: #334155;
      cursor: pointer;
      flex: 1;
      user-select: none;
    }

    .item-label input[type="checkbox"] {
      width: 19px;
      height: 19px;
      accent-color: #10b981;
      cursor: pointer;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      line-height: 1;
      transition: color 0.15s, background-color 0.15s;
    }

    .delete-btn:hover {
      color: #ef4444;
      background-color: #fee2e2;
    }

    .check-btn {
      width: 100%;
      padding: 13px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #10b981;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s, box-shadow 0.2s;
    }

    .check-btn:hover {
      background-color: #059669;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .result {
      margin-top: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      min-height: 25px;
    }

    .result.success {
      color: #059669;
    }

    .result.warning {
      color: #e11d48;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">❄️ 포근한 겨울 산책</div>
    <h1>외출 준비물 체크</h1>

    <img src="photo.png" alt="눈 오는 날 외출 준비" class="header-image">

    <div class="input-group">
      <input type="text" id="newItemInput" class="item-input" placeholder="새 준비물 입력 (예: 핫팩)" onkeydown="handleEnter(event)">
      <button type="button" class="add-btn" onclick="addItem()">추가</button>
    </div>

    <div id="itemList" class="item-list">
      <div class="item-row">
        <label class="item-label">
          <input type="checkbox" class="check-item">
          <span class="item-name">📱 휴대전화</span>
        </label>
        <button type="button" class="delete-btn" onclick="deleteItem(this)" title="삭제">&times;</button>
      </div>
      <div class="item-row">
        <label class="item-label">
          <input type="checkbox" class="check-item">
          <span class="item-name">☕ 따뜻한 텀블러</span>
        </label>
        <button type="button" class="delete-btn" onclick="deleteItem(this)" title="삭제">&times;</button>
      </div>
      <div class="item-row">
        <label class="item-label">
          <input type="checkbox" class="check-item">
          <span class="item-name">🧤 털장갑</span>
        </label>
        <button type="button" class="delete-btn" onclick="deleteItem(this)" title="삭제">&times;</button>
      </div>
      <div class="item-row">
        <label class="item-label">
          <input type="checkbox" class="check-item">
          <span class="item-name">🧶 모자 / 귀마개</span>
        </label>
        <button type="button" class="delete-btn" onclick="deleteItem(this)" title="삭제">&times;</button>
      </div>
      <div class="item-row">
        <label class="item-label">
          <input type="checkbox" class="check-item">
          <span class="item-name">🧥 따뜻한 외투</span>
        </label>
        <button type="button" class="delete-btn" onclick="deleteItem(this)" title="삭제">&times;</button>
      </div>
    </div>

    <button type="button" class="check-btn" onclick="checkAll()">준비 확인</button>
    <div id="resultMessage" class="result"></div>
  </div>

  <script>
    function addItem() {
      const input = document.getElementById('newItemInput');
      const text = input.value.trim();

      if (!text) {
        alert('준비물 이름을 입력해 주세요.');
        return;
      }

      const list = document.getElementById('itemList');

      const row = document.createElement('div');
      row.className = 'item-row';

      const label = document.createElement('label');
      label.className = 'item-label';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'check-item';

      const span = document.createElement('span');
      span.className = 'item-name';
      span.textContent = text;

      const deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'delete-btn';
      deleteBtn.innerHTML = '&times;';
      deleteBtn.title = '삭제';
      deleteBtn.onclick = function () {
        deleteItem(deleteBtn);
      };

      label.appendChild(checkbox);
      label.appendChild(span);
      row.appendChild(label);
      row.appendChild(deleteBtn);
      list.appendChild(row);

      input.value = '';
      input.focus();
      clearResult();
    }

    function deleteItem(btn) {
      const row = btn.closest('.item-row');
      row.remove();
      clearResult();
    }

    function handleEnter(event) {
      if (event.key === 'Enter') {
        addItem();
      }
    }

    function clearResult() {
      const resultMessage = document.getElementById('resultMessage');
      resultMessage.textContent = '';
      resultMessage.className = 'result';
    }

    function checkAll() {
      const checkboxes = document.querySelectorAll('.check-item');
      const resultMessage = document.getElementById('resultMessage');

      if (checkboxes.length === 0) {
        resultMessage.textContent = '확인할 준비물이 없습니다.';
        resultMessage.className = 'result warning';
        return;
      }

      const allChecked = Array.from(checkboxes).every(box => box.checked);

      if (allChecked) {
        resultMessage.textContent = '❄️ 따뜻하게 준비 완료! 조심히 다녀오세요.';
        resultMessage.className = 'result success';
      } else {
        resultMessage.textContent = '감기 걸리지 않게 덜 챙긴 물건을 확인해 주세요!';
        resultMessage.className = 'result warning';
      }
    }
  </script>

</body>
</html>
